name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands description topics

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff format --check custom_components tests scripts
      - run: ruff check custom_components tests scripts

  tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current
            requirements: requirements_test.txt
          - name: minimum
            requirements: requirements_test_min.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ${{ matrix.requirements }}
      - run: pytest -q
      - name: CLI runs without Home Assistant
        run: python3 -I scripts/wisemirror.py --help
