[project]
name = "ha-wisemirror"
version = "0.2.0"
description = "Home Assistant integration for WiseMirror LED mirrors"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.wisemirror"]
force-sort-within-sections = true
combine-as-imports = true
known-third-party = ["homeassistant"]
