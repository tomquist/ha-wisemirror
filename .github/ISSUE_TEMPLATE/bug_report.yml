name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Integration version, Home Assistant version, mirror model and firmware
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: Enable `custom_components.wisemirror: debug` under `logger:` and reproduce.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → WiseMirror → ⋮ → Download diagnostics.
